version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: codeforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codeforge_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codeforge_password}
      POSTGRES_DB: ${POSTGRES_DB:-codeforge_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
